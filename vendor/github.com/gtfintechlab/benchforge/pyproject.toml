[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-forge"
version = "0.1.0"
description = "A flexible and extensible benchmarking forge for language models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Bench Forge Contributors"},
]
keywords = [
    "evaluation",
    "language-models",
    "benchmarking",
    "llm",
    "testing",
    "forge",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "pyyaml>=5.4",
    "tqdm>=4.62.0",
    "litellm>=1.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "datasets>=3.1.0",
    "python-dotenv>=1.0.1",
    "kaleido>=1.0.0",
    "requests>=2.32.4",
    "aiohttp>=3.10.11",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "backoff>=2.2.1",
    "rich>=14.1.0",
    "click>=8.1.8",
    "typer>=0.16.0",
    "pillow>=10.4.0",
    "scipy>=1.10.1",
    "statsmodels>=0.14.1",
    "jupyter>=1.1.1",
    "ipython>=8.12.3",
    "nbformat>=5.10.4",
    "nbconvert>=7.16.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

datasets = [
    "datasets>=2.0.0",
    "huggingface-hub>=0.16.0",
]

all = [
    "bench-forge[dev]",
    "bench-forge[datasets]",
]

[project.scripts]
bench-forge = "bench_forge.cli:run"

[project.urls]
"Homepage" = "https://github.com/yourusername/bench-forge"
"Bug Tracker" = "https://github.com/yourusername/bench-forge/issues"
"Documentation" = "https://github.com/yourusername/bench-forge#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench_forge*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
bench_forge = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=bench_forge --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
